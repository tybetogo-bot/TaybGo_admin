<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="taybgoadmin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TaybGo Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      background-color: #FFFFFF;
      transition: opacity 0.3s ease;
    }

    #loading img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 32px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E8F5E9;
      border-top: 3px solid #00C853;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-color-scheme: dark) {
      body { background-color: #000000; }
      #loading { background-color: #000000; }
      .spinner { border-color: #1A1A1A; border-top-color: #00C853; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="assets/TaybGo_green.png" alt="TaybGo">
    <div class="spinner"></div>
  </div>
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAx-JBKCauLhDIvMMLjztSVvq3k5PVc8CE",
      authDomain: "taybgoadmin.firebaseapp.com",
      projectId: "taybgoadmin",
      storageBucket: "taybgoadmin.firebasestorage.app",
      messagingSenderId: "927010248626",
      appId: "1:927010248626:web:e5c454c0568e9cff7636ab",
      measurementId: "G-3VMC8YVSYF"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 300);
      }
    });
  </script>
</body>
</html>
