    TaxiCheckout:
      type: object
      description: Request payload for creating a TAXI order.
      properties:
        pickup_address_id:
          type: integer
        dropoff_address_id:
          type: integer
        delivery_instructions:
          type: string
          nullable: true
        requested_vehicle_type:
          $ref: '#/components/schemas/VehicleTypeEnum'
        requested_car_size:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RequestedCarSizeEnum'
          - $ref: '#/components/schemas/NullEnum'
        tip:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '0.00'
        payment_type:
          allOf:
          - $ref: '#/components/schemas/PaymentTypeEnum'
          default: CARD
        payment_method_id:
          type: integer
        idempotency_key:
          type: string
      required:
      - dropoff_address_id
      - payment_method_id
      - pickup_address_id
      - requested_vehicle_type
    TaxiOrderOutput:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order_type:
          $ref: '#/components/schemas/OrderTypeEnum'
        payment_type:
          $ref: '#/components/schemas/PaymentTypeEnum'
        customer:
          allOf:
          - $ref: '#/components/schemas/OrderCustomer'
          readOnly: true
        delivery_instructions:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        subtotal_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Total before discounts (baseline for coupon calculation).
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Discount applied (e.g. via coupon).
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tip:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        pickup_address:
          allOf:
          - $ref: '#/components/schemas/Address'
          readOnly: true
        dropoff_address:
          allOf:
          - $ref: '#/components/schemas/Address'
          readOnly: true
        requested_vehicle_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/VehicleTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        requested_car_size:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RequestedCarSizeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        driver:
          allOf:
          - $ref: '#/components/schemas/OrderDriver'
          readOnly: true
        is_manual:
          type: boolean
        is_paid:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - driver
      - dropoff_address
      - id
      - order_type
      - pickup_address
      - total_amount
    TaxiPricePreview:
      type: object
      description: Serializer for taxi price preview request.
      properties:
        pickup_address_id:
          type: integer
          description: ID of the pickup address (must belong to the current user)
        dropoff_address_id:
          type: integer
          description: ID of the dropoff address (must belong to the current user)
        vehicle_type:
          allOf:
          - $ref: '#/components/schemas/VehicleTypeEnum'
          description: |-
            Vehicle type for the taxi ride

            * `BIKE` - Bike
            * `MOTOR` - Motorcycle
            * `CAR` - Car
            * `VAN` - Van
        car_size:
          nullable: true
          description: |-
            Requested car size (e.g., X, XL, Comfort, Black)

            * `X` - X
            * `COMFORT` - Comfort
            * `XL` - XL
            * `BLACK` - Black
          oneOf:
          - $ref: '#/components/schemas/CarSizeEnum'
          - $ref: '#/components/schemas/NullEnum'
        tip:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '0.00'
          description: Optional tip amount
      required:
      - dropoff_address_id
      - pickup_address_id
      - vehicle_type
    Toggle:
      type: object
      properties:
        is_active:
          type: boolean
      required:
      - is_active
    TokenObtainPair:
