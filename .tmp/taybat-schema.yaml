components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          description: e.g. home, work, office
          maxLength: 50
        is_default:
          type: boolean
          description: Marks the default address for the user
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          description: Latitude
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          description: Longitude
        full_address:
          type: string
        street_name:
          type: string
          nullable: true
          maxLength: 255
        house_number:
          type: string
          nullable: true
          maxLength: 50
        city:
          type: string
          nullable: true
          maxLength: 100
        postal_code:
          type: string
          nullable: true
          maxLength: 20
        country:
          type: string
          nullable: true
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - full_address
      - id
      - label
      - lat
      - lng
    AddressCreateUpdate:
      type: object
      properties:
        id:
          type: integer
