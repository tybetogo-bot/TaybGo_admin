openapi: 3.0.3
info:
  title: Taybat API
  version: 1.0.0
  description: Backend API for Taybat (Food, Taxi, Shipping).
paths:
  /api/addresses/:
    get:
      operationId: addresses_list
      description: List saved addresses for the authenticated user.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: addresses_create
      description: Create a new address for the authenticated user.
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/addresses/{id}/:
    get:
      operationId: addresses_retrieve
      description: Retrieve a saved address.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    put:
      operationId: addresses_update
      description: Replace a saved address.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: addresses_partial_update
      description: Update a saved address.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressCreateUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: addresses_destroy
      description: Delete a saved address.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/cities/:
    get:
      operationId: admin_cities_list
      description: List cities for admin management.
      parameters:
      - in: query
        name: country_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: country_iso_code
        schema:
          type: string
          minLength: 1
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCityList'
          description: ''
    post:
      operationId: admin_cities_create
      description: Create a city (admin).
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/City'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/City'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/City'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
          description: ''
  /api/admin/cities/{id}/:
    get:
      operationId: admin_cities_retrieve
      description: Retrieve a city (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
          description: ''
    put:
      operationId: admin_cities_update
      description: Replace a city (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/City'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/City'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/City'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
          description: ''
    patch:
      operationId: admin_cities_partial_update
      description: Partially update a city (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCity'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCity'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCity'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
          description: ''
    delete:
      operationId: admin_cities_destroy
      description: Delete a city (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/countries/:
    get:
      operationId: admin_countries_list
      description: List countries for admin management.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCountryList'
          description: ''
    post:
      operationId: admin_countries_create
      description: Create a country (admin).
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Country'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Country'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Country'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
          description: ''
  /api/admin/countries/{id}/:
    get:
      operationId: admin_countries_retrieve
      description: Retrieve a country (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
          description: ''
    put:
      operationId: admin_countries_update
      description: Replace a country (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Country'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Country'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Country'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
          description: ''
    patch:
      operationId: admin_countries_partial_update
      description: Partially update a country (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCountry'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCountry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCountry'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
          description: ''
    delete:
      operationId: admin_countries_destroy
      description: Delete a country (admin).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/coupons/:
    get:
      operationId: admin_coupons_list
      description: List coupons with admin-level filters.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: code
        schema:
          type: string
          minLength: 1
      - in: query
        name: from_
        schema:
          type: string
          format: date-time
          title: 'From '
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: restaurant_id
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
          format: date-time
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCouponList'
          description: ''
  /api/admin/coupons/{id}/:
    get:
      operationId: admin_coupons_retrieve
      description: Retrieve coupon details.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCoupon'
          description: ''
  /api/admin/coupons/{id}/disable/:
    post:
      operationId: admin_coupons_disable_create
      description: Disable a coupon.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Toggle'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Toggle'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Toggle'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Toggle'
          description: ''
  /api/admin/coupons/{id}/enable/:
    post:
      operationId: admin_coupons_enable_create
      description: Enable a coupon.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Toggle'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Toggle'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Toggle'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Toggle'
          description: ''
  /api/admin/coupons/{id}/usage/:
    get:
      operationId: admin_coupons_usage_list
      description: List coupon usage for audit.
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date-time
        description: Filter usage created at/after this timestamp.
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
          format: date-time
        description: Filter usage created at/before this timestamp.
      - in: query
        name: user_id
        schema:
          type: integer
        description: Filter usage by user id.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCouponUsageList'
          description: ''
  /api/admin/drivers/{driver_id}/verification-history/:
    get:
      operationId: admin_drivers_verification_history_list
      description: List verification history for a driver.
      parameters:
      - in: path
        name: driver_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminDriverVerificationList'
          description: ''
  /api/admin/drivers/{driver_id}/verify/:
    post:
      operationId: admin_drivers_verify_create
      description: Approve or reject a driver.
      parameters:
      - in: path
        name: driver_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDriverVerificationAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminDriverVerificationAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminDriverVerificationAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDriverVerification'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /api/admin/drivers/verification-queue/:
    get:
      operationId: admin_drivers_verification_queue_list
      description: List drivers awaiting verification (status=PENDING).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminDriverProfileList'
          description: ''
  /api/admin/gift-cards/{gift_card_id}/adjust/:
    post:
      operationId: admin_gift_cards_adjust_create
      description: Adjust gift-card balance as staff and write a ledger entry.
      parameters:
      - in: path
        name: gift_card_id
        schema:
          type: integer
        required: true
      tags:
      - Gift Cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGiftCardAdjust'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminGiftCardAdjust'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminGiftCardAdjust'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGiftCardOperationResponse'
          description: ''
  /api/admin/gift-cards/{gift_card_id}/void/:
    post:
      operationId: admin_gift_cards_void_create
      description: Void a gift card and write a ledger entry.
      parameters:
      - in: path
        name: gift_card_id
        schema:
          type: integer
        required: true
      tags:
      - Gift Cards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGiftCardOperationResponse'
          description: ''
  /api/admin/gift-cards/issue/:
    post:
      operationId: admin_gift_cards_issue_create
      description: Issue a gift card as staff.
      tags:
      - Gift Cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGiftCardIssue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminGiftCardIssue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminGiftCardIssue'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGiftCardIssueResponse'
          description: ''
  /api/admin/home/:
    get:
      operationId: admin_home_retrieve
      description: Return admin dashboard data with per-section pagination (defaults
        to global PAGE_SIZE), descending date sorting, and optional filters.
      parameters:
      - in: query
        name: driver_online
        schema:
          type: boolean
          nullable: true
      - in: query
        name: driver_search
        schema:
          type: string
          minLength: 1
      - in: query
        name: driver_status
        schema:
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          type: string
          minLength: 1
        description: |-
          * `PENDING` - Pending
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
      - in: query
        name: drivers_page
        schema:
          type: integer
      - in: query
        name: drivers_page_size
        schema:
          type: integer
      - in: query
        name: order_type
        schema:
          enum:
          - FOOD
          - SHIPPING
          - TAXI
          type: string
          minLength: 1
        description: |-
          * `FOOD` - Food
          * `SHIPPING` - Shipping
          * `TAXI` - Taxi
      - in: query
        name: orders_from
        schema:
          type: string
          format: date-time
      - in: query
        name: orders_to
        schema:
          type: string
          format: date-time
      - in: query
        name: pending_drivers_page
        schema:
          type: integer
      - in: query
        name: pending_drivers_page_size
        schema:
          type: integer
      - in: query
        name: pending_restaurants_page
        schema:
          type: integer
      - in: query
        name: pending_restaurants_page_size
        schema:
          type: integer
      - in: query
        name: restaurant_search
        schema:
          type: string
          minLength: 1
      - in: query
        name: restaurant_status
        schema:
          enum:
          - PENDING
          - ACTIVE
          - INACTIVE
          type: string
          minLength: 1
        description: |-
          * `PENDING` - Pending
          * `ACTIVE` - Active
          * `INACTIVE` - Inactive
      - in: query
        name: restaurants_page
        schema:
          type: integer
      - in: query
        name: restaurants_page_size
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHomeResponse'
          description: ''
  /api/admin/loyalty/:
    get:
      operationId: admin_loyalty_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminLoyaltyListList'
          description: ''
  /api/admin/loyalty/adjust/:
    post:
      operationId: admin_loyalty_adjust_create
      description: Adjust loyalty points for a user.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoyaltyAdjust'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminLoyaltyAdjust'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminLoyaltyAdjust'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoyaltyAdjustResponse'
          description: ''
  /api/admin/orders/:
    get:
      operationId: admin_orders_list
      description: Admin order dashboard with filters and pagination. When `order_type`
        is omitted, rows use the full order payload. When `order_type` is provided,
        rows use the matching type-specific payload.
      parameters:
      - in: query
        name: customer_id
        schema:
          type: integer
      - in: query
        name: driver_id
        schema:
          type: integer
      - in: query
        name: from_
        schema:
          type: string
          format: date-time
          title: 'From '
      - in: query
        name: order_type
        schema:
          type: string
          minLength: 1
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: restaurant_id
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
      - in: query
        name: status
        schema:
          type: string
          minLength: 1
      - in: query
        name: to
        schema:
          type: string
          format: date-time
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminOrderListResponseList'
          description: When `order_type` is omitted, each row uses the full order
