      - REFUND
      - TIP
      - ADJUSTMENT
      type: string
      description: |-
        * `PAYMENT` - Payment
        * `REFUND` - Refund
        * `TIP` - Tip
        * `ADJUSTMENT` - Adjustment
    UserMe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 20
        birthdate:
          type: string
          format: date
          nullable: true
          description: Birthdate in YYYY-MM-DD format.
        is_verified:
          type: boolean
        created_at:
          type: string
